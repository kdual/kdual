name: Sync FAQ from Google Sheets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-faq.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-faq
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and validate FAQ data
        env:
          FAQ_API_URL: https://script.google.com/macros/s/AKfycbybHQSzIdT0b7kNrYAOvQX4fyETVQ3U9fG1bHMcXq4tiyZNAyZImDIJGWTo9QWBfy02/exec
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          target = pathlib.Path("data/faq.json")
          url = os.environ["FAQ_API_URL"]
          query = urllib.parse.urlencode({"source": "github-actions", "_": int(datetime.now().timestamp())})
          request = urllib.request.Request(f"{url}?{query}", headers={"User-Agent": "kdual-faq-sync/1.0"})

          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)

          if payload.get("ok") is not True or not isinstance(payload.get("items"), list):
              raise SystemExit("Apps Script returned an invalid FAQ payload")

          old_items = None
          if target.exists():
              try:
                  old_items = json.loads(target.read_text(encoding="utf-8")).get("items")
              except (json.JSONDecodeError, OSError):
                  pass

          if old_items == payload["items"]:
              print("FAQ data is already up to date")
              raise SystemExit(0)

          output = {
              "ok": True,
              "syncedAt": datetime.now(timezone.utc).isoformat(),
              "items": payload["items"],
          }
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Updated {target} with {len(payload['items'])} FAQ items")
          PY

      - name: Commit updated FAQ data
        run: |
          if git diff --quiet -- data/faq.json; then
            echo "No FAQ changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/faq.json
          git commit -m "Update FAQ data"
          git push
