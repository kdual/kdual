name: Sync FAQ from Google Sheets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-faq.yml"
      - "index.html"
      - "js/faq.js"
      - "styles/faq-menu.css"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-faq
  # A delayed hosted runner must not be interrupted by the next scheduled run.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch and validate FAQ data
        env:
          FAQ_API_URL: https://script.google.com/macros/s/AKfycbybHQSzIdT0b7kNrYAOvQX4fyETVQ3U9fG1bHMcXq4tiyZNAyZImDIJGWTo9QWBfy02/exec
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          target = pathlib.Path("data/faq.json")
          url = os.environ["FAQ_API_URL"]
          payload = None

          for attempt in range(1, 6):
              try:
                  query = urllib.parse.urlencode({
                      "source": "github-actions",
                      "_": int(time.time()),
                  })
                  request = urllib.request.Request(
                      f"{url}?{query}",
                      headers={"User-Agent": "kdual-faq-sync/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.load(response)
                  print(f"FAQ data fetched successfully on attempt {attempt}")
                  break
              except (
                  urllib.error.HTTPError,
                  urllib.error.URLError,
                  TimeoutError,
                  json.JSONDecodeError,
              ) as error:
                  print(f"Attempt {attempt}/5 failed: {error}")
                  if attempt == 5:
                      raise
                  time.sleep(15)

          if payload.get("ok") is not True or not isinstance(payload.get("items"), list):
              raise SystemExit("Apps Script returned an invalid FAQ payload")

          old_items = None
          if target.exists():
              try:
                  old_items = json.loads(target.read_text(encoding="utf-8")).get("items")
              except (json.JSONDecodeError, OSError):
                  pass

          if old_items == payload["items"]:
              print("FAQ data is already up to date")
              raise SystemExit(0)

          output = {
              "ok": True,
              "syncedAt": datetime.now(timezone.utc).isoformat(),
              "items": payload["items"],
          }
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Updated {target} with {len(payload['items'])} FAQ items")
          PY

      - name: Commit updated FAQ data
        id: commit
        run: |
          if git diff --quiet -- data/faq.json; then
            echo "No FAQ changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/faq.json
          git commit -m "Update FAQ data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made with GITHUB_TOKEN do not trigger a branch-based Pages build.
      - name: Publish FAQ updates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
